# Local development / single-machine build from source.
# For a public VPS with SSL, Portainer and Nginx Proxy Manager use deploy/docker-compose.yml.
services:
  api:
    build: ./backend
    environment:
      # "demo" runs fully offline; "open-meteo" uses live global-model data
      THWX_SOURCE: ${THWX_SOURCE:-demo}
      THWX_OPENMETEO_MODEL: ${THWX_OPENMETEO_MODEL:-gfs_seamless}
      THWX_OPENMETEO_API_KEY: ${THWX_OPENMETEO_API_KEY:-}
      THWX_REFRESH_MINUTES: ${THWX_REFRESH_MINUTES:-360}
      THWX_ENSEMBLE_MEMBERS: ${THWX_ENSEMBLE_MEMBERS:-8}
      THWX_FALLBACK_TO_DEMO: ${THWX_FALLBACK_TO_DEMO:-true}
      THWX_ADMIN_TOKEN: ${THWX_ADMIN_TOKEN:-change-me}
      THWX_RUN_ON_STARTUP: ${THWX_RUN_ON_STARTUP:-true}
      # radar nowcast (RainViewer) + tropical cyclones (GDACS); THWX_NOWCAST_SOURCE=off disables the radar
      THWX_NOWCAST_SOURCE: ${THWX_NOWCAST_SOURCE:-rainviewer}
      THWX_CYCLONES_ENABLED: ${THWX_CYCLONES_ENABLED:-true}
      # Web Push alerts (docs/PUSH.md); empty VAPID keys = generated once into the data volume
      THWX_PUSH_ENABLED: ${THWX_PUSH_ENABLED:-true}
      THWX_VAPID_PUBLIC_KEY: ${THWX_VAPID_PUBLIC_KEY:-}
      THWX_VAPID_PRIVATE_KEY: ${THWX_VAPID_PRIVATE_KEY:-}
      THWX_VAPID_SUBJECT: ${THWX_VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      - thwx-data:/var/lib/thwx
    ports:
      - "127.0.0.1:8000:8000"   # optional: direct API access (/docs), local only
    restart: unless-stopped

  verify:
    build: ./backend
    command: ["python", "-m", "verify", "loop"]
    # This worker has no HTTP server for the image's API healthcheck.
    healthcheck:
      disable: true
    environment:
      THWX_VERIFY_API: http://api:8000
      THWX_ADMIN_TOKEN: ${THWX_ADMIN_TOKEN:-change-me}
      THWX_VERIFY_PUSH: ${THWX_VERIFY_PUSH:-true}
      THWX_OPENMETEO_MODEL: ${THWX_OPENMETEO_MODEL:-gfs_seamless}
      THWX_OPENMETEO_API_KEY: ${THWX_OPENMETEO_API_KEY:-}
    volumes:
      - thwx-data:/var/lib/thwx
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        THWX_API_URL: http://api:8000
    environment:
      THWX_API_URL: http://api:8000
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  thwx-data:
