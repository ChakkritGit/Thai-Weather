[project]
name = "thai-weather-hd"
version = "1.0.0"
description = "High-resolution weather downscaling and API for Thailand"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=2.0",
  "scipy>=1.13",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["shapely>=2.0", "pillow>=10"]

[tool.setuptools.packages.find]
include = ["app*", "verify*"]

[tool.setuptools.package-data]
app = ["data/*.json", "data/*.npz", "data/geo/*.geojson"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() idiom
