name: CI

on:
  push:
  pull_request:

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated token files are up to date
        run: node design-system/scripts/build-tokens.mjs --check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests scripts verify
      - run: ruff format --check app tests scripts verify
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.90.0 fmt --manifest-path rust-api/Cargo.toml --check
      - run: cargo +1.90.0 clippy --locked --all-targets --manifest-path rust-api/Cargo.toml -- -D warnings
      - run: cargo +1.90.0 test --locked --manifest-path rust-api/Cargo.toml
      - run: cargo +1.90.0 build --locked --manifest-path rust-api/Cargo.toml
      - run: pytest -q
        env:
          THWX_RUST_TEST_BIN: ${{ github.workspace }}/backend/rust-api/target/debug/thwx-api
      - name: Rust Dock collector and real HTTP fixture tests
        working-directory: deploy/apps/rust-services
        run: |
          cargo +1.90.0 fmt --check
          cargo +1.90.0 clippy --locked --all-targets -- -D warnings
          cargo +1.90.0 test --locked
          cargo +1.90.0 build --locked
          python3 tests/http_contract.py
      - name: Rust app services and isolated HTTP contracts
        working-directory: deploy/apps/rust-services/runtime
        run: |
          cargo +1.90.0 fmt --check
          cargo +1.90.0 clippy --locked --all-targets -- -D warnings
          cargo +1.90.0 test --locked
          cargo +1.90.0 build --locked
          python3 tests/http_contract.py
          python3 tests/gateway_contract.py
          python3 tests/web_api_contract.py
          python3 tests/backup_contract.py
      - name: Native WebSockets with pinned JavaScript clients
        working-directory: deploy/apps/services
        run: |
          curl -fsSL https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64.zip -o "$RUNNER_TEMP/native-bun.zip"
          echo "36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913  $RUNNER_TEMP/native-bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/native-bun.zip" -d "$RUNNER_TEMP/native-bun"
          "$RUNNER_TEMP/native-bun/bun-linux-x64/bun" install --frozen-lockfile
          APPS_RUST_ROOMS_BIN="$GITHUB_WORKSPACE/deploy/apps/rust-services/runtime/target/debug/apps-runtime" "$RUNNER_TEMP/native-bun/bun-linux-x64/bun" test tests/rooms_contract.test.ts
          APPS_RUST_SYNC_BIN="$GITHUB_WORKSPACE/deploy/apps/rust-services/runtime/target/debug/apps-runtime" "$RUNNER_TEMP/native-bun/bun-linux-x64/bun" test tests/sync_contract.test.ts
          APPS_RUST_CHAT_BIN="$GITHUB_WORKSPACE/deploy/apps/rust-services/runtime/target/debug/apps-runtime" "$RUNNER_TEMP/native-bun/bun-linux-x64/bun" test tests/chat_contract.test.ts
          APPS_RUST_REMINDERS_BIN="$GITHUB_WORKSPACE/deploy/apps/rust-services/runtime/target/debug/apps-runtime" "$RUNNER_TEMP/native-bun/bun-linux-x64/bun" test tests/reminders_contract.test.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Weather text and RSS golden parity
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          APPS_RUST_TEST_BIN="$GITHUB_WORKSPACE/deploy/apps/rust-services/runtime/target/debug/apps-runtime" npx vitest run src/lib/weather-native.test.ts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
