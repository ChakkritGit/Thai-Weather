# ─────────────────────────────────────────────────────────────────────────────
# Thai Weather HD – complete VPS stack in ONE compose file
#
#   nginx-proxy-manager  :80 :443 public (SSL)   UI → nginx.chakkritton.com
#   portainer            internal only            UI → portainer.chakkritton.com
#   dock                 internal only            UI → docker.chakkritton.com (minimal mobile UI on Portainer's API)
#   web  (Next.js)       internal only            →    thai-weather.chakkritton.com
#   api  (Rust HTTP)     private network only     reachable only from `web`
#
# Networks
#   proxy    : nginx-proxy-manager ↔ portainer, web   (what NPM can reach)
#   internal : web ↔ api                              (API never exposed)
#
# Start / update (from this folder):
#   cp .env.example .env && nano .env
#   docker compose up -d                 # first start
#   docker compose pull && docker compose up -d   # update to new images
#
# Build images on the VPS instead of pulling from GHCR:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# ─────────────────────────────────────────────────────────────────────────────
name: thai-weather

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    # L5: keep only the capabilities its init (s6), openresty and certbot use; no privilege escalation
    cap_drop: [MKNOD, NET_RAW, SYS_CHROOT, AUDIT_WRITE, SETFCAP]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    ports:
      - "80:80"
      - "443:443"
      # admin UI only on the VPS itself – used once via SSH tunnel,
      # afterwards through https://nginx.chakkritton.com
      - "127.0.0.1:81:81"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - proxy

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    # L5: Portainer talks to the Docker socket as root (that socket is the real power); the process itself
    # needs no Linux capabilities and cannot gain new privileges
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - proxy

  # Minimal, mobile-first Docker dashboard: static page + /api forwarded to Portainer (deploy/dock).
  # No Docker socket here – login and every Docker call go through Portainer.
  dock:
    image: nginx:1.28-alpine
    container_name: dock
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./dock/www:/usr/share/nginx/html:ro
      - ./dock/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
      - dock

  # Rust host/container/proxy history, built from apps/rust-services. Read-only host views,
  # no Docker socket or capabilities; reachable only from `dock` behind Portainer login.
  # Retains the existing history volume and root UID needed for /proc/<pid>/net reads.
  dock-metrics:
    image: dock-metrics:local
    pull_policy: never
    container_name: dock-metrics
    restart: unless-stopped
    init: true
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    volumes:
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/cgroup:ro
      - /etc/hostname:/host/hostname:ro
      - /etc/os-release:/host/os-release:ro
      - type: volume
        source: npm-data
        target: /npm-logs
        read_only: true
        volume:
          subpath: logs
      - dock-metrics:/data
    networks:
      - dock

  api:
    image: ghcr.io/chakkritgit/thai-weather-api:${THWX_IMAGE_TAG:-latest}
    container_name: thai-weather-api
    restart: unless-stopped
    init: true
    stop_grace_period: 16m  # allow an in-flight scientific run to finish; cut over only while idle
    environment:
      THWX_SOURCE: ${THWX_SOURCE:-open-meteo}
      THWX_OPENMETEO_MODEL: ${THWX_OPENMETEO_MODEL:-gfs_seamless}
      THWX_OPENMETEO_API_KEY: ${THWX_OPENMETEO_API_KEY:-}
      THWX_REFRESH_MINUTES: ${THWX_REFRESH_MINUTES:-360}
      THWX_ENSEMBLE_MEMBERS: ${THWX_ENSEMBLE_MEMBERS:-8}
      THWX_FALLBACK_TO_DEMO: ${THWX_FALLBACK_TO_DEMO:-false}
      THWX_ADMIN_TOKEN: ${THWX_ADMIN_TOKEN:?set THWX_ADMIN_TOKEN in deploy/.env}
      THWX_RUN_ON_STARTUP: ${THWX_RUN_ON_STARTUP:-true}
      THWX_BACKGROUND_TASKS: ${THWX_BACKGROUND_TASKS:-true}
      # radar nowcast (RainViewer) + tropical cyclones (GDACS); THWX_NOWCAST_SOURCE=off disables the radar
      THWX_NOWCAST_SOURCE: ${THWX_NOWCAST_SOURCE:-rainviewer}
      THWX_CYCLONES_ENABLED: ${THWX_CYCLONES_ENABLED:-true}
      # Web Push alerts (docs/PUSH.md); empty VAPID keys = generated once into the data volume
      THWX_PUSH_ENABLED: ${THWX_PUSH_ENABLED:-true}
      THWX_VAPID_PUBLIC_KEY: ${THWX_VAPID_PUBLIC_KEY:-}
      THWX_VAPID_PRIVATE_KEY: ${THWX_VAPID_PRIVATE_KEY:-}
      THWX_VAPID_SUBJECT: ${THWX_VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      - thwx-data:/var/lib/thwx
    networks:
      - internal

  verify:
    image: ghcr.io/chakkritgit/thai-weather-api:${THWX_IMAGE_TAG:-latest}
    container_name: thai-weather-verify
    restart: unless-stopped
    command: ["python", "-m", "verify", "loop"]
    # This worker has no HTTP server for the image's API healthcheck.
    healthcheck:
      disable: true
    environment:
      THWX_VERIFY_API: http://api:8000
      THWX_ADMIN_TOKEN: ${THWX_ADMIN_TOKEN:?set THWX_ADMIN_TOKEN in deploy/.env}
      THWX_VERIFY_PUSH: ${THWX_VERIFY_PUSH:-true}
      THWX_OPENMETEO_MODEL: ${THWX_OPENMETEO_MODEL:-gfs_seamless}
      THWX_OPENMETEO_API_KEY: ${THWX_OPENMETEO_API_KEY:-}
    volumes:
      - thwx-data:/var/lib/thwx
    depends_on:
      - api
    networks:
      - internal

  web:
    init: true
    image: ghcr.io/chakkritgit/thai-weather-web:${THWX_IMAGE_TAG:-latest}
    # no container_name: rollout.sh runs the new and the old side by side; NPM reaches either by the alias
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:-https://thai-weather.chakkritton.com}
      THWX_API_URL: http://api:8000
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    networks:
      internal: {}
      proxy:
        aliases: [thai-weather-web]

networks:
  proxy:
    name: proxy
  dock:
    name: dock-internal
    internal: true   # no internet access, only dock <-> dock-metrics
  internal:
    name: thai-weather-internal

volumes:
  dock-metrics:
  npm-data:
  npm-letsencrypt:
  portainer-data:
  thwx-data:
