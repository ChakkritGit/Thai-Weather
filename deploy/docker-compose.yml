# ─────────────────────────────────────────────────────────────────────────────
# "server" stack: what runs the server itself, shown as the stack "server" in Portainer.
#
#   nginx-proxy-manager  :80 :443 public (SSL)   UI → nginx.chakkritton.com
#   portainer            internal only            UI → portainer.chakkritton.com
#   dock                 internal only            UI → docker.chakkritton.com (minimal mobile UI on Portainer's API)
#   dock-metrics         dock-internal only       host/container/proxy history + security watch for Dock
#
# The sites run in the "apps" stack (deploy/apps; Thai Weather's services come from deploy/weather.yml).
#
# The networks and volumes predate the split (they were created by the former "thai-weather" stack, hence
# the names) and are `external`: Compose never recreates or removes them. A fresh server creates them with
# deploy/apps/backup/restore.sh (or `docker network create` / `docker volume create`, see deploy/README.md).
#
#   docker compose up -d
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build dock-metrics
# ─────────────────────────────────────────────────────────────────────────────
name: server

services:
  nginx-proxy-manager:
    # jc21/nginx-proxy-manager (pinned by digest) with a patched Node: built from npm/Dockerfile
    image: nginx-proxy-manager:local
    pull_policy: never
    container_name: nginx-proxy-manager
    restart: unless-stopped
    # L5: keep only the capabilities its init (s6), openresty and certbot use; no privilege escalation
    cap_drop: [MKNOD, NET_RAW, SYS_CHROOT, AUDIT_WRITE, SETFCAP]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    ports:
      - "80:80"
      - "443:443"
      # admin UI only on the VPS itself – used once via SSH tunnel,
      # afterwards through https://nginx.chakkritton.com
      - "127.0.0.1:81:81"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - proxy

  portainer:
    image: portainer/portainer-ce:lts@sha256:03f94a406496dc84d37b552795fc424ccad8d0d7200353b6a82915f6e8f73ab0
    container_name: portainer
    restart: unless-stopped
    # L5: Portainer talks to the Docker socket as root (that socket is the real power); the process itself
    # needs no Linux capabilities and cannot gain new privileges
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - proxy

  # Minimal, mobile-first Docker dashboard: static page + /api forwarded to Portainer (deploy/dock).
  # No Docker socket here – login and every Docker call go through Portainer.
  dock:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: dock
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./dock/www:/usr/share/nginx/html:ro
      - ./dock/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
      - dock

  # Rust host/container/proxy history and the security watch, built from apps/rust-services.
  # Read-only host views, no Docker socket or capabilities; reachable only from `dock` behind
  # Portainer login (and from apps-chat for security alerts) on dock-internal.
  # Retains the existing history volume and root UID needed for /proc/<pid>/net reads.
  dock-metrics:
    image: dock-metrics:local
    pull_policy: never
    container_name: dock-metrics
    restart: unless-stopped
    init: true
    user: "0:0"
    # adm (4): /var/log/auth.log is syslog:adm 0640, and the container has no CAP_DAC_* to bypass it
    group_add: ["4"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    volumes:
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/cgroup:ro
      - /etc/hostname:/host/hostname:ro
      - /etc/os-release:/host/os-release:ro
      # security watch (apps/rust-services/src/security.rs): logins, files an intruder would change
      # (root's SSH keys and shell startup files among them), container configs, pending updates and
      # the nightly image scan (hardening/dock-image-scan.py). Directories, not files, so log rotation
      # and editors that replace a file are followed. Only hashes, user names and key fingerprints are kept.
      - /var/log:/host/log:ro
      - /etc:/host/etc:ro
      - /root:/host/root:ro
      - /var/spool/cron:/host/cron:ro
      - /boot:/host/boot:ro
      - /var/lib/update-notifier:/host/apt:ro
      - /var/lib/docker/containers:/host/containers:ro
      - /var/lib/dock-scan:/host/scan:ro
      - type: volume
        source: npm-data
        target: /npm-logs
        read_only: true
        volume:
          subpath: logs
      - dock-metrics:/data
    networks:
      - dock

networks:
  proxy:
    name: proxy
    external: true
  dock:
    name: dock-internal   # internal: no internet access, only dock <-> dock-metrics
    external: true

volumes:
  dock-metrics:
    name: thai-weather_dock-metrics
    external: true
  npm-data:
    name: thai-weather_npm-data
    external: true
  npm-letsencrypt:
    name: thai-weather_npm-letsencrypt
    external: true
  portainer-data:
    name: thai-weather_portainer-data
    external: true
