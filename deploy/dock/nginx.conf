# Dock: a minimal, mobile-first Docker dashboard (static files) in front of Portainer's API.
# Login, permissions and all Docker access stay in Portainer; this server only serves the page and
# forwards the few API paths the page uses.
server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 64k;

  # resolve the portainer container per request, so dock starts even while portainer is down
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $portainer portainer:9000;

  set $csp "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }

  # only the Portainer API paths the page needs
  location ~ ^/api/(auth|auth/logout|endpoints|endpoints/[0-9]+/docker/.*)$ {
    proxy_pass http://$portainer;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
  }
  # host / container / traffic history from dock-metrics, only for a valid Portainer session
  location = /api/metrics {
    auth_request /_auth;
    set $metrics dock-metrics:9100;
    proxy_pass http://$metrics/metrics$is_args$args;
    proxy_http_version 1.1;
    add_header Cache-Control "no-store" always;
  }
  # page views / Web Vitals of the self-hosted sites (apps-analytics), also only for a valid session
  location = /api/analytics {
    auth_request /_auth;
    set $analytics apps-analytics:8790;
    proxy_pass http://$analytics/stats$is_args$args;
    proxy_http_version 1.1;
    add_header Cache-Control "no-store" always;
  }
  # whole-server backup bundles (apps-backup): list / create / delete / download link, logged in only
  location ^~ /api/backups {
    auth_request /_auth;
    set $backup apps-backup:8794;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://$backup;
    proxy_http_version 1.1;
    add_header Cache-Control "no-store" always;
  }
  # the download itself: the one-time token from /api/backups/<name>/link is the permission
  location ^~ /api/backups/dl/ {
    set $backup apps-backup:8794;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://$backup;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 600s;
  }
  # Dock's chat (apps-chat): messages, unread count; replies can take a while when an LLM answers
  location ^~ /api/chat {
    auth_request /_auth;
    set $chat apps-chat:8795;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://$chat;
    proxy_http_version 1.1;
    proxy_read_timeout 150s;
    add_header Cache-Control "no-store" always;
  }
  location = /_auth {
    internal;
    proxy_pass http://$portainer/api/users/me;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
  }

  location /api/ { return 404; }
}
