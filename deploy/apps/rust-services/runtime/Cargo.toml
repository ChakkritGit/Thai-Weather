[package]
name = "apps-runtime"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "io-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
hyper = { version = "=1.11.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
subtle = "=2.6.1"
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
sha2 = "=0.10.9"
uuid = { version = "=1.18.1", features = ["v4"] }
url = "=2.5.7"
percent-encoding = "=2.3.2"
reqwest = { version = "=0.12.23", default-features = false, features = ["rustls-tls", "json", "stream"] }
jsonwebtoken = "=9.3.1"
base64 = "=0.22.1"
tokio-util = { version = "=0.7.19", features = ["io"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
