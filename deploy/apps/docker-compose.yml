# ─────────────────────────────────────────────────────────────────────────────
# The apps that moved off Vercel / Cloudflare Workers (deploy/apps/README.md)
#
#   portfolio    Next.js   chakkritton.com, www              (repo WebProfile)
#   expenses     Next.js   expenses.chakkritton.com          (repo Spent-Cost)
#   whiteboard   Next.js   whiteboard.chakkritton.com        (repo Whiteboard)
#     rooms      Bun       whiteboard.chakkritton.com/rooms/ (Yjs relay, was the whiteboard-rooms Worker)
#   drive-music  Next.js   drive-music.chakkritton.com       (repo Drive-Music-Web)
#     sync       Bun       drive-music.chakkritton.com/parties/ (Party Play, was the drive-music-sync Worker)
#   health       Bun       health.chakkritton.com            (containers + internal checks for the status Worker)
#   analytics    Bun       <every site>/_a → Dock "สถิติเว็บ" (was Vercel Analytics + Speed Insights)
#
# Repos are cloned to $REPOS (default /opt/apps/repos) and secrets live in $ENVS (default /opt/apps/env,
# chmod 600) – neither is in git. Images are built by build.sh (autodeploy.sh calls it after a pull):
#   ./build.sh portfolio && docker compose up -d portfolio      # or ./build.sh services
# ─────────────────────────────────────────────────────────────────────────────
name: apps

x-next: &next
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 256
  mem_limit: 384m
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s
    start_interval: 2s   # a fresh container reports healthy within seconds, so a rollout can switch to it

x-bun: &bun
  image: apps-services:local
  restart: unless-stopped
  # Bun as PID 1 ignores SIGTERM: every restart waited 10 s for the kill (rooms/sync dropped longer on each deploy)
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  pids_limit: 128
  mem_limit: 192m

services:
  portfolio:
    <<: *next
    init: true
    image: apps-portfolio:local
    pull_policy: never
    env_file: ${ENVS:-/opt/apps/env}/portfolio.env
    # no container_name: ../rollout.sh runs the new and the old side by side; NPM reaches either by this alias
    networks:
      proxy:
        aliases: [apps-portfolio]
      apps:
        aliases: [apps-portfolio]
    # Next writes its image / fetch cache under .next/cache
    volumes:
      - portfolio-cache:/app/.next/cache

  expenses:
    <<: *next
    image: apps-expenses:local
    # no container_name: ../rollout.sh runs the new and the old side by side; NPM reaches either by this alias
    networks:
      proxy:
        aliases: [apps-expenses]
    pull_policy: never
    env_file: ${ENVS:-/opt/apps/env}/expenses.env
    volumes:
      - expenses-cache:/app/.next/cache

  whiteboard:
    <<: *next
    image: apps-whiteboard:local
    # no container_name: ../rollout.sh runs the new and the old side by side; NPM reaches either by this alias
    networks:
      proxy:
        aliases: [apps-whiteboard]
    pull_policy: never
    env_file: ${ENVS:-/opt/apps/env}/whiteboard.env
    volumes:
      - whiteboard-cache:/app/.next/cache

  drive-music:
    <<: *next
    image: apps-drive-music:local
    # no container_name: ../rollout.sh runs the new and the old side by side; NPM reaches either by this alias
    networks:
      proxy:
        aliases: [apps-drive-music]
    pull_policy: never
    env_file: ${ENVS:-/opt/apps/env}/drive-music.env
    volumes:
      - drive-music-cache:/app/.next/cache

  # Built once, used by the three Bun services below.
  rooms:
    <<: *bun
    container_name: apps-rooms
    pull_policy: never
    command: ["bun", "src/rooms.ts"]
    environment:
      PORT: "8787"
      PATH_PREFIX: /rooms
    networks: [proxy, apps]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8787/__health"]
      interval: 30s
      timeout: 5s
      retries: 3

  sync:
    <<: *bun
    container_name: apps-sync
    command: ["bun", "src/sync.ts"]
    pull_policy: never
    depends_on: [rooms]
    environment:
      PORT: "8788"
      SYNC_DB: /data/sync.db
    env_file: ${ENVS:-/opt/apps/env}/sync.env
    volumes:
      - sync-data:/data
    networks: [proxy, apps]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8788/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # health.chakkritton.com: what the status Worker on Cloudflare cannot see from outside, in one answer:
  # every container's state + Docker health (a snapshot the host writes every 30 s, apps-container-health
  # timer; no Docker socket here) and the internal services. Also relays the Worker's alerts to Dock's chat.
  health:
    <<: *bun
    container_name: apps-health
    command: ["bun", "src/health.ts"]
    pull_policy: never
    environment:
      PORT: "8789"
      CONTAINERS_FILE: /host/containers.tsv
      ROOMS_URL: http://apps-rooms:8787
      SYNC_URL: http://apps-sync:8788
      REMINDERS_URL: http://apps-reminders:8792/
      ALERT_URL: http://apps-chat:8795/chat/alert
    env_file: ${ENVS:-/opt/apps/env}/health.env
    volumes:
      - /run/apps-health:/host:ro
    networks: [proxy, apps]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8789/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Portfolio uploads (was a Supabase Storage bucket): public at chakkritton.com/media/, written by the
  # portfolio server on the internal network with MEDIA_TOKEN.
  media:
    <<: *bun
    container_name: apps-media
    command: ["bun", "src/media.ts"]
    pull_policy: never
    env_file: ${ENVS:-/opt/apps/env}/media.env
    environment:
      PORT: "8793"
      MEDIA_DIR: /data/media
    volumes:
      - media-data:/data
    networks: [proxy, apps]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8793/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Whole-server backup bundles for Dock's "สำรองข้อมูล" page (restore with the bundle's restore.sh).
  # Reads everything read-only (root with only the read-any-file capability); writes only the bundles.
  backup:
    image: apps-backup:local
    pull_policy: never
    container_name: apps-backup
    restart: unless-stopped
    init: true
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    environment:
      PORT: "8794"
    volumes:
      - /var/lib/docker/volumes:/volumes:ro
      - /opt/apps/env:/src/env:ro
      - /opt/thai-weather/deploy/.env:/src/thai-weather.env:ro
      - /root/origin-ca:/src/origin-ca:ro
      - /opt/apps/repos:/src/repos:ro
      - /opt/thai-weather:/src/thai-weather:ro
      - /opt/apps/backups/bundles:/bundles
    networks: [proxy, apps]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8794/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---- the apps' own database (moved from Supabase; login stays on Supabase Auth) --------------------
  db:
    image: postgres:17.11-alpine3.24
    container_name: apps-db
    restart: unless-stopped
    env_file: ${ENVS:-/opt/apps/env}/db.env
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "log_min_duration_statement=2000"]
    shm_size: 64m
    mem_limit: 384m
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [apps]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgREST for the expenses database, as Supabase's /rest/v1 was. Only dbgw talks to it.
  rest:
    image: postgrest/postgrest:v14.18
    container_name: apps-rest
    restart: unless-stopped
    env_file: ${ENVS:-/opt/apps/env}/rest.env
    environment:
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_POOL: "5"
      PGRST_SERVER_PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    networks: [apps]

  # Checks Supabase Auth sessions, then hands requests to PostgREST / the reminders service.
  dbgw:
    <<: *bun
    container_name: apps-dbgw
    command: ["bun", "src/dbgw.ts"]
    pull_policy: never
    env_file: ${ENVS:-/opt/apps/env}/dbgw.env
    environment:
      PORT: "8791"
      REST_URL: http://apps-rest:3000
      REMINDERS_URL: http://apps-reminders:8792
    networks: [proxy, apps]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8791/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Spent-Cost's morning bill reminders and test pushes (was the push-reminders edge function + pg_cron).
  reminders:
    image: apps-reminders:local
    pull_policy: never
    container_name: apps-reminders
    restart: unless-stopped
    init: true
    env_file: ${ENVS:-/opt/apps/env}/reminders.env
    environment:
      PORT: "8792"
      DB_URL: http://apps-dbgw:8791
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    networks: [proxy, apps]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8792/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Page views + Web Vitals: each site posts to /_a (NPM forwards it here); Dock reads /stats.
  analytics:
    <<: *bun
    container_name: apps-analytics
    command: ["bun", "src/analytics.ts"]
    pull_policy: never
    environment:
      PORT: "8790"
      ANALYTICS_DB: /data/analytics.db
    volumes:
      - analytics-data:/data
    networks: [proxy]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8790/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Dock's chat: a summary of each month on its last evening, answers to what is typed (an LLM can be
  # plugged in through chat.env: Cloudflare Workers AI or any OpenAI-compatible server). Reads
  # dock-metrics on Dock's internal network, the other services on proxy.
  chat:
    <<: *bun
    container_name: apps-chat
    command: ["bun", "src/chat.ts"]
    pull_policy: never
    env_file:
      - path: ${ENVS:-/opt/apps/env}/chat.env
        required: false
    environment:
      PORT: "8795"
      CHAT_DB: /data/chat.db
      TZ: Asia/Bangkok
    volumes:
      - chat-data:/data
    networks: [proxy, dock]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8795/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  proxy:
    external: true
  apps:
    name: apps-internal
  dock:
    external: true
    name: dock-internal

volumes:
  portfolio-cache:
  expenses-cache:
  whiteboard-cache:
  drive-music-cache:
  sync-data:
  chat-data:
  analytics-data:
  db-data:
  media-data:
