# SymOS's update feed at updates.chakkritton.com (NPM forwards here): static files only, from
# /opt/symos-updates on the host, published by the SymOS repo's scripts/publish-update.sh. Each manifest is
# signed with a key that never leaves the publisher's Mac; SymOS checks it before using anything (docs/UPDATES.md
# there), so this server only has to hand out files.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080;
    root /srv;
    autoindex off;
    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }
    # The manifest and its signature change with every release; images never change once published.
    location ~ ^/symos/latest\.json(\.sig)?$ {
      add_header Cache-Control "no-cache" always;
    }
    location ~ ^/symos/symos-[0-9.]+\.img$ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
      return 404;
    }
  }
}
