# ─────────────────────────────────────────────────────────────────────────────
# Thai Weather (ฟ้าละเอียด) – part of the "apps" stack: deploy/apps/docker-compose.yml includes this file,
# so Portainer lists these services under "apps". Run compose from deploy/apps.
#
#   web  (Next.js)          proxy + internal   →    thai-weather.chakkritton.com
#   api  (Rust HTTP+Python) internal only      reachable only from web, verify and weather-web-api
#   verify (Python)         internal only      verification loop
#   weather-web-api (Rust)  internal only      text/RSS/feeds formatting for web
#
# Variables come from deploy/.env (THWX_ADMIN_TOKEN …). Images are built here, on the VPS:
#   cd deploy/apps && docker compose build web api && ../rollout.sh web
# The api restarts with a brief stop/start (see backend/rust-api/README.md before restarting it).
# ─────────────────────────────────────────────────────────────────────────────
services:
  api:
    image: thai-weather-api:local
    build:
      context: ../backend
    container_name: thai-weather-api
    restart: unless-stopped
    init: true
    stop_grace_period: 16m  # allow an in-flight scientific run to finish; cut over only while idle
    environment:
      THWX_SOURCE: ${THWX_SOURCE:-open-meteo}
      THWX_OPENMETEO_MODEL: ${THWX_OPENMETEO_MODEL:-gfs_seamless}
      THWX_OPENMETEO_API_KEY: ${THWX_OPENMETEO_API_KEY:-}
      THWX_REFRESH_MINUTES: ${THWX_REFRESH_MINUTES:-360}
      THWX_ENSEMBLE_MEMBERS: ${THWX_ENSEMBLE_MEMBERS:-8}
      THWX_FALLBACK_TO_DEMO: ${THWX_FALLBACK_TO_DEMO:-false}
      THWX_ADMIN_TOKEN: ${THWX_ADMIN_TOKEN:?set THWX_ADMIN_TOKEN in deploy/.env}
      THWX_RUN_ON_STARTUP: ${THWX_RUN_ON_STARTUP:-true}
      THWX_BACKGROUND_TASKS: ${THWX_BACKGROUND_TASKS:-true}
      # radar nowcast (RainViewer) + tropical cyclones (GDACS); THWX_NOWCAST_SOURCE=off disables the radar
      THWX_NOWCAST_SOURCE: ${THWX_NOWCAST_SOURCE:-rainviewer}
      THWX_CYCLONES_ENABLED: ${THWX_CYCLONES_ENABLED:-true}
      # Web Push alerts (docs/PUSH.md); empty VAPID keys = generated once into the data volume
      THWX_PUSH_ENABLED: ${THWX_PUSH_ENABLED:-true}
      THWX_VAPID_PUBLIC_KEY: ${THWX_VAPID_PUBLIC_KEY:-}
      THWX_VAPID_PRIVATE_KEY: ${THWX_VAPID_PRIVATE_KEY:-}
      THWX_VAPID_SUBJECT: ${THWX_VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      - thwx-data:/var/lib/thwx
    networks:
      - internal

  verify:
    # same image as api (built there); no build section so it is built only once
    image: thai-weather-api:local
    pull_policy: never
    container_name: thai-weather-verify
    restart: unless-stopped
    command: ["python", "-m", "verify", "loop"]
    # This worker has no HTTP server for the image's API healthcheck.
    healthcheck:
      disable: true
    environment:
      THWX_VERIFY_API: http://api:8000
      THWX_ADMIN_TOKEN: ${THWX_ADMIN_TOKEN:?set THWX_ADMIN_TOKEN in deploy/.env}
      THWX_VERIFY_PUSH: ${THWX_VERIFY_PUSH:-true}
      THWX_OPENMETEO_MODEL: ${THWX_OPENMETEO_MODEL:-gfs_seamless}
      THWX_OPENMETEO_API_KEY: ${THWX_OPENMETEO_API_KEY:-}
    volumes:
      - thwx-data:/var/lib/thwx
    depends_on:
      - api
    networks:
      - internal

  web:
    init: true
    image: thai-weather-web:local
    build:
      context: ../frontend
      args:
        THWX_API_URL: http://api:8000
    # no container_name: rollout.sh runs the new and the old side by side; NPM reaches either by the alias
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:-https://thai-weather.chakkritton.com}
      THWX_API_URL: http://api:8000
      THWX_WEB_API_URL: http://weather-web-api:8801
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    networks:
      internal: {}
      proxy:
        aliases: [thai-weather-web]

  # Native formatting of the public machine-readable forecasts; reads the existing API only.
  weather-web-api:
    image: apps-rust:local
    pull_policy: never
    command: ["weather-web-api"]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    environment:
      PORT: "8801"
      SITE_URL: ${SITE_URL:-https://thai-weather.chakkritton.com}
      THWX_API_URL: http://api:8000
    networks: [internal]
    healthcheck:
      test: ["CMD", "/apps-runtime", "weather-web-api", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  proxy:   # identical to deploy/apps/docker-compose.yml's, so the include does not conflict
    external: true
  internal:
    name: thai-weather-internal
    external: true

volumes:
  thwx-data:
    name: thai-weather_thwx-data
    external: true
