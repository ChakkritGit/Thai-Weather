# Copy to the NPM data volume as /data/nginx/custom/http_top.conf (included at the top of NPM's http block).
# Login brute-force protection (Portainer / Dock / NPM): POSTs to a login endpoint, per client IP.
map $request_method $login_limit_key { POST $binary_remote_addr; default ""; }
limit_req_zone $login_limit_key zone=login:10m rate=6r/m;
limit_req_status 429;
limit_req_log_level warn;
