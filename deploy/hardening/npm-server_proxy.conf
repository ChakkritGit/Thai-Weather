# Next.js apps behind Supabase Auth send several large Set-Cookie headers;
# the 4k default makes nginx answer 502 (upstream sent too big header).
proxy_buffer_size 32k;
proxy_buffers 8 32k;
proxy_busy_buffers_size 64k;
# Every upstream is a container on this host (connects in < 1 ms). A short connect timeout lets nginx move
# to the other container of a rollout (deploy/rollout.sh) when its cached address points at the stopped one.
proxy_connect_timeout 2s;
proxy_next_upstream error timeout;
