# BEGIN portfolio-probe-guard
# These paths have no application routes or public assets in WebProfile. Reject
# commodity config/PHP scans before Next's localized 404 can load translations/DB.
# Keep normal page 404s, /api, /studio, /media, /_next and /.well-known unchanged.
location ~* (^|/)\.(?:env(?:[./]|$)|git(?:/|$)|svn(?:/|$)|aws(?:/|$)|azure(?:/|$)|claude(?:/|$)|vscode(?:/|$)|idea(?:/|$)|zed(?:/|$)) {
  return 404;
}
location ~* \.(?:php[0-9]?|phtml|asp|aspx|jsp|cgi)(?:/|$) {
  return 404;
}
location ~* ^/(?:wp-admin|wp-content|wp-includes|wordpress|phpmyadmin|pma|assets|settings)(?:/|$) {
  return 404;
}
location ~* ^/(?:mcp\.(?:json|ya?ml)|aws/(?:config|credentials)(?:\.(?:json|ya?ml))?|config(?:uration)?\.(?:json|ya?ml)|package(?:-lock)?\.json|yarn\.lock|bun\.lockb?|docker-compose\.ya?ml|compose\.ya?ml|Dockerfile|(?:sftp|ftp)-?config\.json|__/firebase/.*)$ {
  return 404;
}
# END portfolio-probe-guard
